# Guazza — nginx configuration
# Serve i file statici (JSON previsioni + dashboard HTML) su guazza.it
# Usato dietro Cloudflare (CDN/WAF) — SSL terminato da Cloudflare o da Caddy.
#
# Path sul server locale (Dell Optiplex Micro 3050):
#   HTML/JS frontend:  /var/www/guazza/html/
#   JSON previsioni:   /var/www/guazza/data/
#   Log nginx:         /var/log/nginx/guazza*.log

server {
    listen 80;
    server_name guazza.it www.guazza.it;

    # Health check endpoint (usato da UptimeRobot)
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Dashboard HTML statica
    location / {
        root /var/www/guazza/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache: il frontend è quasi statico
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # JSON previsioni (aggiornati ogni 6h)
    location /data/ {
        alias /var/www/guazza/data/;
        autoindex off;

        # CORS per accesso da browser (Cloudflare Pages in futuro)
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Content-Type "application/json; charset=utf-8";

        # Cache: 5 minuti (previsioni aggiornate ogni 6h, ma CDN può invalidare)
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # Blocca accesso a file di sistema
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/guazza_access.log;
    error_log  /var/log/nginx/guazza_error.log warn;
}

