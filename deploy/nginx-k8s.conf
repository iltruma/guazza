# Guazza — nginx config per k8s pod web
#
# Differenze rispetto a deploy/nginx.conf (variante host-path):
#   - porta 8080 (non-richiede root, allineata al CMD del container)
#   - log su /dev/stdout e /dev/stderr (raccolti da k8s)
#   - pid in /tmp/nginx.pid (scrivibile con readOnlyRootFilesystem)
#   - JSON path = /var/lib/guazza/output (PVC subPath: output)
#
# Nessun server_name: il routing tailnet lo fa Traefik; l'esposizione pubblica
# passa da Tailscale Funnel (porta locale 8080 inoltrata al nodo Tailscale).

server {
    listen 8080;
    server_name "";

    # Health check (k8s readiness/liveness probe + Uptime Kuma)
    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    # Frontend statico (embedded nell'immagine)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # JSON previsioni dal PVC (subPath: output montato su /var/lib/guazza/output)
    location /data/ {
        alias /var/lib/guazza/output/;
        autoindex off;
        default_type application/json;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        expires 5m;
    }

    # Blocca accesso a file dot (es. .env, .git)
    location ~ /\. {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
