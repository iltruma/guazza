<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guazza · Previsioni meteo iper-locale Toscana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/suncalc/suncalc.js" crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="g-header" id="g-header">
    <div class="g-header__top">
      <h1 class="g-header__brand">
        <span aria-hidden="true">🌧️</span>
        <span>Guazza</span>
      </h1>
      <div id="header-meta" class="g-header__meta"></div>
    </div>
    <div class="g-tabs-wrap">
      <nav id="tabs" class="g-tabs no-scrollbar" aria-label="Location"></nav>
    </div>
  </header>

  <main id="app" class="g-main">

    <!-- Skeleton -->
    <div id="skeleton-state" class="g-skeleton" aria-hidden="true">
      <div class="g-skeleton__block" style="height:116px"></div>
      <div class="g-skeleton__strip">
        <div class="g-skeleton__strip-card"></div>
        <div class="g-skeleton__strip-card"></div>
        <div class="g-skeleton__strip-card"></div>
        <div class="g-skeleton__strip-card"></div>
        <div class="g-skeleton__strip-card"></div>
      </div>
      <div class="g-skeleton__block" style="height:480px"></div>
      <div class="g-skeleton__block" style="height:300px"></div>
    </div>

    <!-- Error -->
    <div id="error-state" class="g-error hidden">
      <p class="g-error__msg" id="error-msg">Errore nel caricamento</p>
      <p class="g-error__hint">Assicurati che il server stia servendo i JSON da /data/</p>
    </div>

    <!-- ① HERO -->
    <section id="hero-card" class="g-hero hidden anim-fade-up">
      <div class="g-hero__inner">

        <div class="g-hero__identity">
          <div class="g-hero__loc" id="hero-loc-name">
            <span class="g-hero__loc-pulse"></span>
            <span>—</span>
          </div>
          <div class="g-hero__body">
            <div class="g-hero__temp-side">
              <div class="g-hero__temp-row">
                <span id="hero-icon" class="g-hero__icon"></span>
                <span id="hero-temp" class="font-sans">—</span>
              </div>
              <div id="hero-condition" class="g-hero__condition-text"></div>
            </div>
            <div class="g-hero__stats" id="hero-stats"></div>
          </div>
        </div>

        <!-- indicators inline (scroll, no wrap) -->
        <div class="g-hero__indicators" id="hero-indicators"></div>

        <!-- alba · tramonto · fase lunare -->
        <div class="g-hero__sun" id="hero-sun"></div>

      </div>
    </section>

    <!-- ② QUALITÀ DELL'ARIA -->
    <section id="aq-section" class="g-aq-section hidden">
      <div class="g-aq-section__head">
        <span class="g-section__kicker" style="padding:0">Qualità dell'aria</span>
        <span class="g-aq-section__source">ARPAT</span>
      </div>
      <div class="g-aq-grid" id="aq-grid"></div>
    </section>

    <!-- ③ RADAR (sempre aperto) -->
    <section id="radar-section" class="g-radar-section">
      <div id="radar-container" class="g-radar__container">

        <div id="radar-map"></div>

        <!-- Badge top-left -->
        <div class="g-radar__badge-pill">
          <div class="g-radar__sonar">
            <span class="g-radar__sonar-dot"></span>
            <span class="g-radar__sonar-ring"></span>
          </div>
          <span class="g-radar__label">Radar</span>
          <span id="radar-frame-badge" class="g-radar__frame-badge hidden"></span>
        </div>

        <!-- Zoom buttons top-right -->
        <div class="g-radar__zoom">
          <button id="radar-zoom-in"  class="g-radar__zoom-btn" aria-label="Zoom in">+</button>
          <button id="radar-zoom-out" class="g-radar__zoom-btn" aria-label="Zoom out">−</button>
        </div>

        <!-- Controls bottom -->
        <div class="g-radar__controls">
          <div class="g-radar__controls-inner">
            <button id="radar-play" class="g-radar__play" aria-label="Play/Pausa"></button>
            <input id="radar-slider" type="range" min="0" max="0" value="0" step="1" aria-label="Radar timeline">
            <span id="radar-time" class="g-radar__time">—</span>
          </div>
        </div>

        <!-- Error overlay -->
        <div id="radar-error" class="g-radar__error hidden"></div>

      </div>
    </section>

    <!-- ③ PREVISIONI: striscia + dettaglio a 2 colonne -->
    <div id="forecast-section" class="g-forecast hidden">

      <div id="day-strip" class="g-strip no-scrollbar"></div>

      <section id="day-detail" class="g-detail">

        <!-- Top: head + metriche + indicatori (full width) -->
        <div class="g-detail__top">

          <header class="g-detail__head">
            <div class="g-detail__head-meta">
              <span id="detail-lead" class="g-detail__lead"></span>
              <span id="detail-emessa" class="g-detail__emessa"></span>
            </div>
            <div class="g-detail__title-row">
              <span id="detail-icon" class="g-detail__icon"></span>
              <div class="g-detail__title-col">
                <h2 id="detail-title" class="g-detail__title"></h2>
                <span id="detail-subtitle" class="g-detail__subtitle"></span>
              </div>
            </div>
          </header>

          <!-- Metric bento: 3 colonne -->
          <div class="g-detail__metrics">
            <div class="g-metric">
              <span class="g-metric__label">T max</span>
              <div id="detail-tmax" class="g-metric__value g-metric__value--warm">—</div>
              <div id="detail-ci-tmax"></div>
            </div>
            <div class="g-metric">
              <span class="g-metric__label">T min</span>
              <div id="detail-tmin" class="g-metric__value g-metric__value--cool">—</div>
              <div id="detail-ci-tmin"></div>
            </div>
            <div class="g-metric">
              <span class="g-metric__label">Precip</span>
              <div id="detail-precip-val" class="g-metric__value">—</div>
              <div id="detail-ci-precip"></div>
            </div>
          </div>

          <!-- Correzione intraday D+0 (visibile solo oggi) -->
          <div id="detail-intraday" class="g-detail__intraday"></div>

          <!-- Indicatori DLE -->
          <div id="detail-indicators" class="g-detail__indicators"></div>

        </div>

        <!-- Bottom: grafico orario + NWP modelli (stack verticale) -->
        <div class="g-detail__bottom">

          <div class="g-detail__chart-col" id="chart-daily-section">

            <div class="g-detail__right-header">
              <div id="model-switch" class="g-model-switch">
                <span id="model-pill" class="g-model-switch__pill"></span>
              </div>
              <div class="g-chart-legend">
                <span class="g-chart-legend__item">
                  <span class="g-chart-legend__dot g-chart-legend__dot--temp"></span>Temp
                </span>
                <span class="g-chart-legend__item">
                  <span class="g-chart-legend__dot g-chart-legend__dot--precip"></span>Precip
                </span>
                <span class="g-chart-legend__item">
                  <span class="g-chart-legend__dot g-chart-legend__dot--wind"></span>Vento
                </span>
              </div>
            </div>

            <div class="g-chart-scroll">
              <div class="g-chart-wrap g-chart-wrap--icons g-chart-wrap--scroll">
                <canvas id="meteo-chart" role="img" aria-label="Profilo orario del giorno selezionato: temperatura, precipitazione e vento. Valori in dettaglio nella tabella Confronto modelli."></canvas>
                <div id="chart-tooltip" class="g-chart-tooltip"></div>
                <div id="meteo-chart-icons" class="g-chart-icons"></div>
              </div>
            </div>

          </div>

          <div class="g-detail__nwp-col">
            <div class="g-nwp">
              <span class="g-section__kicker">Confronto modelli</span>
              <div class="g-nwp__wrap">
                <div id="nwp-list"></div>
              </div>
            </div>
          </div>

        </div>

      </section>
    </div>

    <!-- ③ GRAFICO SETTIMANALE -->
    <section id="chart-weekly-section" class="g-card hidden">
      <div class="g-card__header">
        <span class="g-section__kicker" style="padding:0;font-size:0.625rem">7 giorni</span>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
          <div id="weekly-model-switch" class="g-model-switch">
            <span id="weekly-model-pill" class="g-model-switch__pill"></span>
          </div>
          <div class="g-chart-legend">
            <span class="g-chart-legend__item">
              <span class="g-chart-legend__dot g-chart-legend__dot--temp"></span>Temp
            </span>
            <span class="g-chart-legend__item">
              <span class="g-chart-legend__dot g-chart-legend__dot--precip"></span>Precip
            </span>
            <span class="g-chart-legend__item">
              <span class="g-chart-legend__dot g-chart-legend__dot--wind"></span>Vento
            </span>
          </div>
        </div>
      </div>
      <div class="g-chart-scroll">
        <div class="g-chart-wrap g-chart-wrap--icons g-chart-wrap--scroll g-chart-wrap--weekly">
          <canvas id="multiday-chart" role="img" aria-label="Profilo a 7 giorni: temperatura, precipitazione e vento."></canvas>
          <div id="chart-weekly-tooltip" class="g-chart-tooltip"></div>
          <div id="multiday-chart-icons" class="g-chart-icons"></div>
        </div>
      </div>
    </section>

    <!-- ④ SKILL: MAE Guazza vs NWP per orizzonte -->
    <section id="skill-section" class="g-card hidden">
      <div class="g-card__header">
        <div class="g-skill__head">
          <span class="g-section__kicker" style="padding:0;font-size:0.625rem">Quanto è affidabile</span>
          <span id="skill-sub" class="g-skill__sub"></span>
        </div>
        <div id="skill-seg" class="g-skill__seg" role="tablist" aria-label="Variabile">
          <button class="g-skill__seg-btn is-active" data-var="tmax_c" role="tab">T max</button>
          <button class="g-skill__seg-btn" data-var="tmin_c" role="tab">T min</button>
        </div>
      </div>
      <div class="g-chart-wrap g-skill__wrap">
        <canvas id="skill-chart" role="img" aria-label="Errore medio assoluto di Guazza e del consensus NWP per orizzonte di previsione, da D+0 a D+7."></canvas>
      </div>
      <p id="skill-caption" class="g-skill__caption"></p>
    </section>

    <!-- ④ COVERAGE BAR -->
    <div id="coverage-bar" class="g-coverage hidden">
      <div id="coverage-numbers"></div>
    </div>

  </main>

  <!-- Tooltip globale indicatori -->
  <div id="indicator-tooltip" class="hidden" role="tooltip"></div>

  <script src="app.js" defer></script>
</body>
</html>
