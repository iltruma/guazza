# Guazza — CI
# Trigger: push tag v*.*.*  (test + build + push immagine)
# Niente trigger su push main o PR: il rilascio è un atto deliberato.
#
# Tag immagine allineati al tag git:
#   - vX.Y.Z → ghcr.io/iltruma/guazza:vX.Y.Z   (con prefisso, per chi cerca "v...")
#   - vX.Y.Z → ghcr.io/iltruma/guazza:X.Y.Z    (allineato a pyproject.toml [project] version)
# Il bump avviene modificando `version` in pyproject.toml e creando il tag.

name: CI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: test (pytest + ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --extra dev
      - name: ruff
        run: uv run ruff check src/
      - name: mypy
        run: uv run mypy src/
      - name: pytest
        run: uv run pytest

  build:
    name: build & push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Login ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/iltruma/guazza:v${{ steps.version.outputs.version }}
            ghcr.io/iltruma/guazza:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
