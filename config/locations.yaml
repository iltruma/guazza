# Guazza — configurazione location
#
# sir_station_id:   stazione primaria SIR (termo/anemo/igro) — ground truth validato
# sir_stations:     set completo per tipo sensore, ordinato per preferenza
# sir_idro_id:      stazione idrometrica più vicina per allerte fiumi
# netatmo:          fetch dinamico via getpublicdata (bbox calcolata da lat/lon).
#                   Stazioni selezionate al runtime, pesi calcolati sul posto,
#                   log in netatmo_fetch_log. Nessuna lista MAC fissa.
# NB: cfr_station_id rimosso — CFR e SIR condividono la stessa rete fisica.

locations:

  casa_campi:
    upstream_pluvio_stations: [TOS11000503]  # Vaiano (Bisenzio a monte, 16km)
    label: "Casa - Campi Bisenzio"
    address: "Campi Bisenzio (FI)"
    lat: 43.82
    lon: 11.13
    elevation_m: 42
    # SIR primaria: Case Passerini — 3.1km, 33m, ΔQ=-9m
    sir_station_id: TOS01001225
    sir_stations:
      termo:  [TOS01001225, TOS01001205, TOS01001215, TOS11000076]
      # Case Passerini 3.1km 33m | Prato Università 7.7km 65m | S. Giusto 8.4km 42m | Artimino 8.8km 107m
      pluvio: [TOS01001225, TOS01004784, TOS01004811, TOS01001205]
      # Case Passerini 3.1km | Calenzano 5.0km | Ponte a Signa 6.0km | Prato Università 7.7km
      anemo:  [TOS01001225, TOS01001205, TOS01001215, TOS11000076]
      igro:   [TOS01001225, TOS01001205, TOS01001215, TOS11000076]
    sir_idro_id: TOS01004791    # S. Piero a Ponti (Bisenzio) — 1.8km
    arpat_station_id: FI-SIGNA
    arpat_stations:
      - id: FI-SIGNA
        weight: 1.0    # ~5km, suburbana | nrt: NO2, O3 | daily: NO2, O3, PM10
    arpat_zone: "agglomerato_firenze"
    extras:
      - bisenzio_level    # → sir_idro_id TOS01004791 (S. Piero a Ponti, Bisenzio)
      - aria_qualita
    notes: >
      Piana fluviale, nebbie invernali, isola di calore moderata.
      SIR: Case Passerini (TOS01001225) 3.1km ΔQ=-9m.
      Netatmo: stazione a 0.32km ΔQ=-3m — ottima copertura iperlocale.
      Idro Bisenzio a 1.8km: rilevante per allerte esondazione.

  lavoro_cosimo:
