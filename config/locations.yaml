    label: "Lavoro Cosimo - Scandicci"
    address: "Scandicci (FI)"
    lat: 43.75
    lon: 11.17
    elevation_m: 42
    # SIR primaria: S. Giusto (Scandicci) — 2.2km, 42m, ΔQ=0m
    sir_station_id: TOS01001215
    sir_stations:
      termo:  [TOS01001215, TOS03001099, TOS01001225, TOS03001097]
      # S. Giusto 2.2km 42m | Firenze Boboli 6.7km 112m | Case Passerini 7.8km 33m | Firenze OrtoBotanico 8.0km 48m
      pluvio: [TOS03001145, TOS01001215, TOS03001099, TOS01004811]
      # Vingone 1.2km 54m | S. Giusto 2.2km | Firenze Boboli 6.7km | Ponte a Signa 6.7km
      anemo:  [TOS01001215, TOS03001099, TOS01001225, TOS01001096]
      # TOS03001097 (Orto Botanico) ESCLUSA: no anemometro
      igro:   [TOS01001215, TOS03001099, TOS01001225, TOS03001097]
    sir_idro_id: TOS01004731    # Ponte di Scandicci (Greve) — 2.0km
    arpat_station_id: FI-SCANDICCI
    arpat_stations:
      - id: FI-SCANDICCI
        weight: 1.0    # ~2km, stesso comune | nrt: NO2 | daily: NO2, PM10
    arpat_zone: "agglomerato_firenze"
    extras:
      - aria_qualita
    notes: >
      Conca FI sud, isola di calore urbana, molto vicino a Firenze.
      SIR: S. Giusto (TOS01001215) 2.2km ΔQ=0m.
      Netatmo: 5 stazioni entro 1.4km tutte ΔQ<15m — copertura eccellente.
      Idro Greve a 2.0km (Ponte di Scandicci).

  lavoro_madda:
