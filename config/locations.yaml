# ── Metadati globali ────────────────────────────────────────────────────────
metadata:
  coordinate_source: "geocoding manuale"
  sir_station_source: "API SIR Toscana actions.php?action=list — 2026-05-13"
  netatmo_note: >
    Fetch Netatmo dinamico via getpublicdata per bbox intorno a ogni location.
    Stazioni selezionate al runtime (no lista MAC fissa): più robusto a offline/privacy.
    Pesi calcolati on-the-fly (decay distanza + quota). Log in netatmo_fetch_log.
  ground_truth_note: >
    Ground truth primario = SIR (validato, storico lungo).
    Netatmo = iperlocale, real-time, non validato.
    Per casa_cesto Netatmo è il riferimento più vicino disponibile.
