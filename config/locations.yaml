      # Il Palagio 3.6km | Casa Rota 6.7km | Poggio alla Croce 8.6km | Montevarchi 10.1km | Lamole 10.0km
      anemo:  [TOS11000516, TOS01004571]
      igro:   [TOS11000516, TOS01004571]
    sir_idro_id: TOS01004591    # Incisa Valle (Arno) — 11.1km (più vicina disponibile)
    arpat_station_id: FI-FIGLINE
