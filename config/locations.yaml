      - TOS11000092   # Bagni di Lucca        ~55km  Appennino lucchese
      - TOS11000031   # Montecarlo            ~51km  pianura lucchese
    label: "Lavoro Madda - Prato"
    address: "Prato (PO)"
    lat: 43.88
    lon: 11.09
    elevation_m: 68
    # SIR primaria: Prato Università — 1.0km, 65m, ΔQ=-3m
    sir_station_id: TOS01001205
    sir_stations:
