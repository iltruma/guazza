      # Vaiano acquedotto ESCLUSA: 322m, ΔQ=+254m inaccettabile
      pluvio: [TOS01001205, TOS01004779, TOS01004784, TOS01001269]
      # Prato Università 1.0km | Gamberame 5.6km 107m | Calenzano 5.6km 60m | La Ferruccia 6.9km
      anemo:  [TOS01001205, TOS01001269, TOS01001225]
      igro:   [TOS01001205, TOS01001269, TOS01001225]
    sir_idro_id: TOS01004782    # Prato (Bisenzio) — 1.2km
    arpat_station_id: PO-ROMA
    arpat_stations:
      - id: PO-ROMA
        weight: 0.7    # ~1km, traff. urbano  | nrt: BENZENE, NO2      | daily: BENZENE, NO2, PM10, PM2.5
      - id: PO-FERRUCCI
        weight: 0.3    # traff./industriale    | nrt: CO, NO2           | daily: CO, NO2, PM10, PM2.5
