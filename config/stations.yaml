# Guazza — anagrafica stazioni di monitoraggio
#
# Fonte: API SIR ajax_stations.php — 2026-05-13; IDST CSV verificati — 2026-05-14
# Campi sir_stations:
#   quota_m:  quota stazione slm (null se non restituita dall'API)
#   sensors:  sensori confermati da ajax_stations.php (nomi fisici)
#   hysto:    storico disponibile
#   type:     meteo | idro | meteo+idro
#
# Per determinare quali IDST scaricare per una stazione, intersecare
# sensors con sir_idst_map. barometro, radiometro_*, evaporimetro sono
# solo realtime — nessuno storico CSV disponibile per quei sensori.

# Mappatura sensore fisico → IDST endpoint CSV storico download.php
# Endpoint: GET https://www.sir.toscana.it/archivio/download.php?IDST=<idst>&IDS=<station_id>
# Nota: barometro, radiometro_*, evaporimetro sono SOLO realtime — nessuno storico CSV disponibile.
sir_idst_map:
  termometro:  termo_csv
  pluviometro: pluvio0_24
  igrometro:   igro0_24
  anemometro:  anemo0_24
  idrometro:   idro_l

