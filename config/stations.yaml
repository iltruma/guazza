# cfr_stations: rimosso — CFR e SIR condividono la stessa rete fisica di stazioni.

arpat_stations:

  # Fonte API ARPAT — 2026-05-13:
  #   real-time (oraria):  https://api.arpat.toscana.it/app/air/nrt/valori_last
  #   bollettino (giorn.): https://api.arpat.toscana.it/app/air/bollettini/dati
  # Coordinate non disponibili via API (metadata-catalog richiede auth 401).
  # zona_omogenea: campo restituito dal bollettino.

  FI-SIGNA:
    nome: "Signa"
    comune: "Signa (FI)"
    zona_omogenea: "Agglomerato di Firenze"
    sensors_nrt:   [NO2, O3]
    sensors_daily: [NO2, O3, PM10]
    used_by: [casa_campi]
    notes: "Comune confinante con Campi Bisenzio, ~5km. Suburbana."

  FI-SCANDICCI:
    nome: "Scandicci"
    comune: "Scandicci (FI)"
    zona_omogenea: "Agglomerato di Firenze"
    sensors_nrt:   [NO2]
    sensors_daily: [NO2, PM10]
    used_by: [lavoro_cosimo]
    notes: "Stesso comune di lavoro_cosimo, ~2km."

  PO-ROMA:
    nome: "Prato Via Roma"
