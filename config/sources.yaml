# Guazza — sorgenti dati: endpoint, parametri, note di accesso
#
# Stato di ogni endpoint: OK / DA_VERIFICARE / INSTABILE / NO_API

sources:

  # ── Previsioni numeriche ──────────────────────────────────────────────────

  open_meteo_forecast:
    label: "Open-Meteo Forecast API"
    url: "https://api.open-meteo.com/v1/forecast"
    status: OK
    auth: none
    rate_limit: "10.000 req/giorno (free tier)"
    models_available:
      - ecmwf_ifs025
      - icon_eu
      - gfs025
      - arome_france              # copertura storica limitata, vedi known_issues KI003
      - icon_d2                   # DWD, 2.2km Italia, ogni 3h
      - italia_meteo_arpae_icon_2i  # ItaliaMeteo/ARPAE, 2.2km Italia, ogni 12h, 72h horizon
    variables:
      - temperature_2m
      - relative_humidity_2m
      - precipitation
      - wind_speed_10m
      - wind_direction_10m
      - cloud_cover
    horizon_h: 168   # 7 giorni
    notes: >
      Multi-modello: richiedere tutti i modelli in un'unica chiamata
      (parametro &models=ecmwf_ifs025,icon_eu,...).
      Nessuna API key richiesta.

  open_meteo_historical_forecast:
    label: "Open-Meteo Historical Forecast API"
    url: "https://historical-forecast-api.open-meteo.com/v1/forecast"
    status: OK
    auth: none
    coverage_start: "2022-01-01"
    notes: >
      Archivio run passati (essenziale per training). Stessa interfaccia
      di Forecast API ma con parametri start_date/end_date.
      ECMWF disponibile dal 2022, ICON-EU dal 2021, AROME ~2023.

  # ── Osservazioni real-time ────────────────────────────────────────────────

  sir_toscana_realtime:
    label: "SIR Toscana — stazioni real-time"
    base_url: "https://www.sir.toscana.it/monitoraggio"
    endpoints:
      station_data: "actions.php?action=station&id={station_id}"
      station_meta: "ajax_stations.php?id={station_id}&types=undefined"
      station_list: "actions.php?action=list&type_gauge={tipo}"
    status: OK
    auth: none
    headers:
      X-Requested-With: "XMLHttpRequest"
      Referer: "https://www.sir.toscana.it/"
    format: JSON
    update_freq: "~15 min"
    rate_limit: "~1 req/s (429 se parallelo)"
    sensor_types: [termo, pluvio, anemo, igro, idro]
    json_structure:
      termo:  '{"value": "13.0", "date": "DD/MM/YYYY HH:MM:SS"}'
      igro:   '{"value": "90",   "date": "..."}'
      anemo:  '{"speed": "0.2",  "dir": "287", "speed_label": null}'   # dir in gradi decimali
      pluvio: '{"CUM00": "0.2",  "CUM01": "3.4", "CUM24": "5.4", ...}' # CUM01=ultima ora
    notes: >
      Endpoint corretto: /monitoraggio/actions.php (non /open_layers/actions.php che è deprecato).
      Struttura JSON cambiata rispetto alla versione precedente: value invece di valore,
      dir in gradi decimali invece di stringa cardinale, pluvio con cumulativi multipli.
      CUM01 usato come precip_mm realtime (cumulativo ultima ora).
      wind_gust_ms non esposta dal nuovo endpoint.

  sir_toscana_historical:
    label: "SIR Toscana — serie storiche validate"
    url: "https://www.sir.toscana.it/archivio/dati.php"
    params:
      A: "{year}"
      IDS: "{station_id}"
      IDST: "{sensor_type}"   # termo | pluvio0_24 | igro0_24 | anemo0_24 | idro_l
    status: OK
    auth: none
    format: HTML   # tabella 31×12 (giorni × mesi), parsing custom
    rate_limit: "1.2s/req (throttling manuale)"
    coverage_start: "2000"
    sensor_types:
      termo:      [tmax_c, tmin_c]
      pluvio0_24: [precip_mm]
      igro0_24:   [hum_max_pct, hum_med_pct, hum_min_pct]
      anemo0_24:  [wind_gust_ms, wind_speed_ms, wind_dir_deg]
      idro_l:     [level_m]
    special_values:
      "»": missing
      "-": zero_precip
      "[ v ]": reconstructed
    validation_states: [VALIDATO, PRE-VALIDATO, NON VALIDATO]
    notes: >
      Endpoint scoperto via HAR (2026-05-13). Risposta HTML, parsing robusto con flag.
      Fetcher: src/guazza/fetchers.py

  # ── Qualità aria ─────────────────────────────────────────────────────────

  arpat:
    label: "ARPAT Toscana — qualità aria"
    endpoints:
      nrt:        "https://api.arpat.toscana.it/app/air/nrt/valori_last"
      bollettini: "https://api.arpat.toscana.it/app/air/bollettini/dati"
    status: OK
    auth: none
    format: JSON
    update_freq:
      nrt:        "oraria"
      bollettini: "giornaliera"
    stations_mapped:
      casa_campi:    [FI-SIGNA]
      lavoro_cosimo: [FI-SCANDICCI]
      lavoro_madda:  [PO-ROMA, PO-FERRUCCI]   # pesi: 0.7 / 0.3
      casa_cesto:    [FI-FIGLINE, AR-ENELSB-SANGIOVANNI]   # pesi: 0.8 / 0.2
    variables_nrt:        [NO2, O3, CO, BENZENE]
    variables_bollettini: [NO2, O3, PM10, PM2.5, BENZENE, CO]
    notes: >
      Endpoint bollettini: ?startdate=YYYY-MM-DD&enddate=YYYY-MM-DD&stazione=<id>&limit=1000.
      Endpoint trovati via analisi HAR (2026-05-13). Coordinate stazioni non esposte
      (metadata-catalog → 401). arpat_zone per casa_campi = agglomerato_firenze.
      Stazioni: 6 totali mappate con pesi per location (vedi config/locations.yaml).

  # ── Radar precipitazioni (frontend only) ────────────────────────────────

  rainviewer:
    label: "RainViewer — radar precipitazioni"
    url: "https://api.rainviewer.com/public/weather-maps.json"
    status: OK
    auth: none
    format: JSON
    scope: frontend_only   # tile embed nel frontend, nessuna ingestion strutturata
    notes: >
      API pubblica gratuita per tile radar. Utilizzata nel frontend V1
      per embed radar (visualizzazione, non ingestion dati strutturati).
      CFR Toscana rimosso: copertura allerte già fornita da SIR idrometria.
      Documentazione: https://www.rainviewer.com/api.html

  # ── Benchmark providers ───────────────────────────────────────────────────

  yr_no:
    label: "Yr.no (API ufficiale)"
    url: "https://api.met.no/weatherapi/locationforecast/2.0/compact"
    status: DA_VERIFICARE
    auth: "User-Agent obbligatorio (ToS MET Norway)"
    format: JSON
    tos: "https://api.met.no/doc/TermsOfService"
    notes: >
      API ufficiale MET Norway, preferire rispetto allo scraping HTML.
      Richiede header User-Agent identificativo.
      Rate limit: max 20 req/s, no IP ban se si rispetta ToS.
      Da verificare in Sprint 4 (benchmark provider).

  meteoam:
    label: "MeteoAM — Aeronautica Militare"
    url: "https://www.meteoam.it/ta/query/meteoPoint"
    status: DA_VERIFICARE
    auth: DA_VERIFICARE
    format: DA_VERIFICARE
    notes: >
      Aeronautica Militare. Verificare se esiste endpoint API o solo HTML.
      Da verificare in Sprint 4 (benchmark provider).

  threebmeteo:
    label: "3BMeteo"
    url: "https://www.3bmeteo.com"
    status: DA_VERIFICARE
    auth: none
    format: HTML_scraping
    tos: "DA_VERIFICARE — solo benchmark aggregato, no ridistribuzione"
    notes: >
      Scraping HTML per confronto accuracy. Rispettare ToS.
      Solo per benchmark MAE/CRPS aggregato (dati mai ridistribuiti).
      Da verificare in Sprint 4 (benchmark provider).

  ilmeteo:
    label: "iLMeteo"
    url: "https://www.ilmeteo.it"
    status: DA_VERIFICARE
    auth: none
    format: HTML_scraping
    tos: "DA_VERIFICARE — solo benchmark aggregato, no ridistribuzione"
    notes: >
      Come 3BMeteo. Solo benchmark statistico aggregato.
      Da verificare in Sprint 4 (benchmark provider).

  # ── LAMMA (V2, non Sprint 1) ─────────────────────────────────────────────

  lamma_wrf:
    label: "LAMMA Toscana — WRF 3km"
    url: "http://www.lamma.toscana.it/meteo/modelli/wrf"
    status: DA_VERIFICARE
    auth: DA_VERIFICARE
    format: GRIB2
    sprint: 2
    notes: >
      WRF 3km, MOLOCH 2.5km. Risoluzione molto maggiore di Open-Meteo.
      Accesso dati grezzi GRIB da verificare (dati.lamma.toscana.it).
      Non incluso in Sprint 1, previsto per V2.
