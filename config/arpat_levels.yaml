# Guazza — Scala livelli qualità aria ARPAT Toscana
#
# Fonte: https://api.arpat.toscana.it/app/air/config
# Aggiornato: 2026-05-15
#
# Usato dal DLE (Sprint 5) per classificare i valori ARPAT con le soglie ufficiali.
# Non interrogare l'API a runtime — questa config è statica, aggiornare manualmente
# se ARPAT modifica le scale (raro).
#
# levelValue semantica:
#   1 = Minima   2 = Bassa   3 = Media   4 = Media-alta   5 = Alta
#   6 = Molto alta   7 = Oltre il limite
#
# Nota unità: CO in mg/m³, tutti gli altri in µg/m³.

inquinanti:

  pm10:
    label: "Particolato PM10"
    unita: "µg/m³"
    aggregazione: "media giornaliera"
    limite_normativo: 50
    norma: "D.Lgs.155/2010 - Allegato XI"
    livelli:
      - value: 1
        label: "Minima"
        min: 0
        max: 9
      - value: 2
        label: "Bassa"
        min: 10
        max: 19
      - value: 3
        label: "Media"
        min: 20
        max: 29
      - value: 4
        label: "Media-alta"
        min: 30
        max: 39
      - value: 5
        label: "Alta"
        min: 40
        max: 50
      - value: 7
        label: "Oltre il limite"
        min: 50

