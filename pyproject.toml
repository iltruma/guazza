[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guazza"
version = "0.14.0"
description = "Previsioni meteo iper-locali per microclimi toscani"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1",
    "lightgbm>=4.3",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8.3",
    "loguru>=0.7",
    "typer>=0.12",
    "pandas>=2.2",
    "polars>=0.20",
    "pyarrow>=16.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "boto3>=1.34",         # R2 backup (S3-compatible)
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "types-beautifulsoup4",
]

[project.scripts]
guazza-ingest         = "guazza.jobs.ingest:app"
guazza-review         = "guazza.jobs.review:app"
guazza-forecast       = "guazza.jobs.forecast:app"
guazza-backup         = "guazza.jobs.backup:app"
guazza-storage        = "guazza.storage:app"

[tool.hatch.build.targets.wheel]
packages = ["src/guazza"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]  # B008: typer.Option() in defaults è il pattern corretto per typer

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
packages = ["guazza"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short"

[tool.coverage.run]
source = ["guazza"]
omit = ["*/jobs/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[dependency-groups]
dev = [
    "httpx[http2]>=0.28.1",
]
