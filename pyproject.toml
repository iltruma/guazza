[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guazza"
version = "0.1.0"
description = "Previsioni meteo iper-locali per microclimi toscani"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "lightgbm>=4.3",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8.3",
    "loguru>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "typer>=0.12",
    "pandas>=2.2",
    "polars>=0.20",
    "pyarrow>=16.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "boto3>=1.34",         # R2 backup (S3-compatible)
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "types-beautifulsoup4",
]

[project.scripts]
guazza-ingest-realtime  = "guazza.jobs.ingest_realtime:app"
guazza-ingest-forecasts = "guazza.jobs.ingest_forecasts:app"
guazza-predict          = "guazza.jobs.predict:app"
guazza-retrain          = "guazza.jobs.retrain:app"
guazza-validate         = "guazza.jobs.validate:app"
guazza-backup           = "guazza.jobs.backup:app"

[tool.hatch.build.targets.wheel]
packages = ["src/guazza"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
packages = ["guazza"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["guazza"]
